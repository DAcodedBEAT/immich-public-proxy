name: Create and publish a Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'

# A newer push to the same feature branch supersedes an in-flight publish;
# tag releases and manual runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  # Never publish an image whose build, tests or lint fail
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for actions/attest-build-provenance
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        run: echo "PACKAGE_VERSION=$(jq -r '.version' app/package.json)" >> "$GITHUB_ENV"

      # secrets can't be referenced directly in a step's `if:` condition, so
      # stash the check in an env var first.
      - name: Check for Docker Hub credentials
        run: echo "HAS_DOCKER_HUB=${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub push is only meaningful on the upstream repo - a fork
      # won't have these secrets set, and skipping the login (rather than
      # failing) lets feature-branch pushes still publish to GHCR cleanly.
      - name: Log in to Docker Hub
        if: ${{ env.HAS_DOCKER_HUB == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine target images
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          UPLOAD_IMAGES="ghcr.io/${{ github.repository }}-upload"
          if [ "$HAS_DOCKER_HUB" = "true" ]; then
            IMAGES="${{ github.repository }}
          $IMAGES"
            UPLOAD_IMAGES="${{ github.repository }}-upload
          $UPLOAD_IMAGES"
          fi
          {
            echo "IMAGES<<EOF"
            echo "$IMAGES"
            echo "EOF"
            echo "UPLOAD_IMAGES<<EOF"
            echo "$UPLOAD_IMAGES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Extract Docker image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(env.PACKAGE_VERSION, '-') }}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE_VERSION=${{ env.PACKAGE_VERSION }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        if: ${{ env.HAS_DOCKER_HUB == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Extract upload image metadata
        id: upload-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UPLOAD_IMAGES }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=v${{ env.PACKAGE_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(env.PACKAGE_VERSION, '-') }}
            type=ref,event=branch

      - name: Build and push upload image
        id: upload-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.upload
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE_VERSION=${{ env.PACKAGE_VERSION }}
          tags: ${{ steps.upload-metadata.outputs.tags }}
          labels: ${{ steps.upload-metadata.outputs.labels }}
          annotations: ${{ steps.upload-metadata.outputs.annotations }}
          cache-from: type=gha,scope=upload
          cache-to: type=gha,mode=max,scope=upload

      - name: Attest GHCR upload image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-upload
          subject-digest: ${{ steps.upload-build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub upload image
        if: ${{ env.HAS_DOCKER_HUB == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ github.repository }}-upload
          subject-digest: ${{ steps.upload-build.outputs.digest }}
          push-to-registry: true
